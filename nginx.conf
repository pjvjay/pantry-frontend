# nginx config for the pantry frontend.
#
# Serves the Vite build under /pantry/ and proxies /pantry/api/ to the
# API service. In Kubernetes the ingress routes /pantry/api straight to
# the pantry-api Service (this proxy is then just a fallback); in
# docker-compose this proxy IS the router — the compose service and the
# k8s Service are both named `pantry-api`, so one upstream works in both.

server {
    listen 80;
    server_name _;

    # Container-level liveness/readiness probe target.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Convenience: the bare host redirects into the app.
    location = / {
        return 302 /pantry/;
    }
    location = /pantry {
        return 302 /pantry/;
    }

    # API proxy — trailing slash on proxy_pass strips the /pantry/api/
    # prefix, so /pantry/api/recipes → http://pantry-api:8000/recipes.
    location /pantry/api/ {
        proxy_pass http://pantry-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The /plan endpoint waits on LLM calls — allow slow responses.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # SPA static files. try_files falls back to index.html so client-side
    # state survives a refresh.
    location /pantry/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /pantry/index.html;
    }

    # Static assets get long-lived caching (Vite fingerprints filenames).
    location /pantry/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
