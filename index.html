<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantry Planner</title>
    <script>
      // The theme the shopper chose (System, Light or Dark; src/theme.ts), set on <html> before
      // the first paint so a dark choice never flashes light. Nothing kept: follow the system.
      try {
        var theme = localStorage.getItem('pantry.theme.v1');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The display face for headings and the wordmark (--font-display in src/styles/tokens.css).
         Delete this one line to turn it off: the headings fall back to Georgia. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
