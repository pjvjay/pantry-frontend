# ============================================================
# pantry-frontend — pull-request verification
#
# build-and-deploy only runs on push to main, so nothing type-checked a
# branch before it merged. A PR whose base had moved on merged cleanly at
# the git level and left main unable to compile. This closes that gap:
# type-check and build every PR, publish nothing.
# ============================================================

name: verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # tsc separately from the build so a type error is reported as one
      - run: npx tsc --noEmit
      - run: npm run build

  # The release path through the Dockerfile: the version build args must
  # reach dist/version.json and the image labels, or a release would
  # report "unknown". One platform, loaded locally, pushed nowhere.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image with a version
        run: |
          docker build --build-arg APP_VERSION=9.9.9 --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIME=2026-01-01T00:00:00Z -t pantry-frontend:verify .
      - name: version.json and the labels carry it
        run: |
          docker run --rm --entrypoint cat pantry-frontend:verify /usr/share/nginx/html/version.json \
            | tee "$RUNNER_TEMP/version.json"
          python3 - "$RUNNER_TEMP/version.json" <<'PY'
          import json, os, sys
          v = json.load(open(sys.argv[1]))
          want = {"version": "9.9.9", "revision": os.environ["GITHUB_SHA"],
                  "built_at": "2026-01-01T00:00:00Z"}
          sys.exit(0 if v == want else f"version.json is {v}, expected {want}")
          PY
          label=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' pantry-frontend:verify)
          test "$label" = 9.9.9 || { echo "::error::image label version is '$label'"; exit 1; }
